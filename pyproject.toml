[project]
name = "irpf-importer"
version = "0.4.0"
description = "Ferramentas experimentais para importar CSV/XLSX no XML local do IRPF 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
irpf-importer = "irpf_importer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
